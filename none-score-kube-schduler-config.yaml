apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
#clientConnection:
#  qps: 2000
#  burst: 4000
percentageOfNodesToScore: 1   # 只评分 5% 节点
parallelism: 128            # 并行度

profiles:
- schedulerName: 2-scheduler
  plugins:
    score:
      disabled:
      - name: "*"
    filter:
      disabled:
      - name: "*"
      enabled:
      - name: NodeResourcesFit  # CPU/内存/GPU等资源匹配
      - name: NodePorts         # 检查端口冲突
      - name: TaintToleration   # 污点容忍（新名字）
  pluginConfig:
  - name: NodeResourcesFit
    args:

